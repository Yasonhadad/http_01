<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The One | Unified Rental Feed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <p class="eyebrow">The One</p>
            <h1>Unified Rental Feed</h1>
            <p class="subtitle">
                One card per property, merged across Facebook, Yad2, and Madlan.
            </p>
        </header>

        <section class="feed-controls" aria-label="Feed filters">
            <button class="filter-chip active" type="button" data-filter="all">All</button>
            <button class="filter-chip" type="button" data-filter="fresh">Fresh (&lt;24h)</button>
            <button class="filter-chip" type="button" data-filter="watch">1-2 weeks</button>
            <button class="filter-chip" type="button" data-filter="stale">&gt;1 month</button>
        </section>

        <section id="feed" class="feed" aria-live="polite"></section>
    </main>

    <template id="property-card-template">
        <article class="property-card">
            <div class="card-topline">
                <span class="age-tag"></span>
                <span class="confidence-pill"></span>
            </div>

            <h2 class="property-price"></h2>
            <p class="property-location"></p>
            <p class="property-specs"></p>

            <section class="timeline">
                <h3>Timeline</h3>
                <div class="timeline-grid">
                    <div>
                        <span class="label">First spotted</span>
                        <strong class="first-spotted"></strong>
                    </div>
                    <div>
                        <span class="label">Last updated / bumped</span>
                        <strong class="last-bumped"></strong>
                    </div>
                </div>
            </section>

            <section class="source-section">
                <h3>Sources</h3>
                <div class="source-list"></div>
            </section>

            <details class="history-panel">
                <summary>Price history</summary>
                <ul class="price-history"></ul>
            </details>

            <section class="crm-actions" aria-label="Personal CRM actions">
                <button type="button" data-action="contacted">Contacted</button>
                <button type="button" data-action="scheduled_viewing">Scheduled Viewing</button>
                <button type="button" data-action="not_relevant">Not Relevant</button>
            </section>
        </article>
    </template>

    <script src="script.js"></script>
</body>
</html>
